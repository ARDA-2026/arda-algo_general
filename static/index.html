<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>Han River Drift</title>
  <style>
    /* ── 테마 변수 ─────────────────────────────────────────
   캔버스는 CSS 변수를 읽지 못하므로 JS 쪽 PALETTES 와 짝을 맞춰 유지할 것 */
    :root {
      --bg: #1a1a2e;
      --panel: #0f0f1a;
      --card: #1e1e30;
      --card2: #16162a;
      --text: #e0e0e0;
      --text-dim: #888;
      --accent: #7df;
      --border: #333;
      --overlay: rgba(20, 20, 40, 0.85);
      --overlay-h: rgba(50, 50, 80, 0.95);
      --chip: rgba(0, 0, 0, 0.6);
    }

    body[data-theme="light"] {
      --bg: #eef2f7;
      --panel: #ffffff;
      --card: #f1f5f9;
      --card2: #e6ecf3;
      --text: #1e293b;
      --text-dim: #64748b;
      --accent: #0369a1;
      --border: #cbd5e1;
      --overlay: rgba(255, 255, 255, 0.9);
      --overlay-h: rgba(226, 232, 240, 0.98);
      --chip: rgba(255, 255, 255, 0.85);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', monospace;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    #canvas-wrap {
      flex: 1;
      position: relative;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }

    #toolbar {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      gap: 6px;
    }

    .tbtn {
      background: var(--overlay);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    .tbtn:hover {
      background: var(--overlay-h);
      border-color: var(--accent);
    }

    .tbtn.active {
      background: rgba(0, 100, 180, 0.7);
      border-color: var(--accent);
      color: #fff;
    }

    /* 비상 착륙 — 패널이 아니라 캔버스에 고정한다.
   패널은 스크롤되므로 결정적인 순간에 화면 밖으로 사라질 수 있다. */
    #estop {
      position: absolute;
      top: 10px;
      right: 12px;
      background: #dc2626;
      color: #fff;
      border: 2px solid #fca5a5;
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: .5px;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 2px 12px rgba(220, 38, 38, .45);
    }

    #estop:hover {
      background: #ef4444;
    }

    #estop:active {
      transform: translateY(1px);
    }

    #coords,
    #hint {
      position: absolute;
      bottom: 10px;
      background: var(--chip);
      color: var(--text-dim);
      padding: 3px 9px;
      border-radius: 8px;
      font-size: 11px;
      pointer-events: none;
    }

    #coords {
      left: 10px;
    }

    #hint {
      left: 50%;
      transform: translateX(-50%);
      color: var(--accent);
    }

    #panel {
      width: 300px;
      background: var(--panel);
      border-left: 1px solid var(--border);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }

    /* ── 패널 상단 탭 (정보 / 드론) ── */
    .tabs {
      display: flex;
      gap: 6px;
    }

    .tab-btn {
      flex: 1;
      padding: 9px 4px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      background: var(--card2);
      color: var(--text-dim);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: inherit;
    }

    .tab-btn:hover {
      border-color: var(--accent);
    }

    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .tab-page {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card {
      background: var(--card);
      border-radius: 8px;
      padding: 11px;
    }

    /* 열화상 확대 */
    #thermal-zoom {
      background: var(--card2); color: var(--text);
      border: 1px solid var(--border); border-radius: 5px;
      padding: 1px 7px; font-size: 12px; line-height: 1.4; cursor: pointer;
    }
    #thermal-zoom:hover { border-color: var(--accent); color: var(--accent); }

    #thermal-modal {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,0.82);
      display: none; align-items: center; justify-content: center;
      flex-direction: column; gap: 10px; padding: 24px;
    }
    #thermal-modal.on { display: flex; }
    #thermal-modal img {
      max-width: 96vw; max-height: 84vh;
      border-radius: 8px;
      /* 열화상은 32x24 저해상도라 부드럽게 늘리면 뭉갠 것처럼 보인다.
         픽셀을 그대로 키워야 클러스터 경계가 보인다. */
      image-rendering: pixelated;
    }
    #thermal-modal .bar {
      display: flex; gap: 10px; align-items: center;
      color: #e8e8e8; font-size: 12px; background: none; height: auto;
    }
    #thermal-close {
      background: rgba(255,255,255,0.12); color: #fff;
      border: 1px solid rgba(255,255,255,0.35); border-radius: 6px;
      padding: 4px 12px; font-size: 12px; cursor: pointer;
    }
    #thermal-close:hover { background: rgba(255,255,255,0.24); }

    .card h3 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
      margin-bottom: 8px;
    }

    .stat {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 4px;
      gap: 8px;
    }

    .stat .val {
      font-weight: bold;
      color: var(--accent);
      text-align: right;
    }

    h2 {
      font-size: 14px;
      color: var(--accent);
      text-align: center;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .connected {
      color: #22c55e;
      font-size: 11px;
      text-align: center;
    }

    .disconnected {
      color: #ef4444;
      font-size: 11px;
      text-align: center;
    }

    /* waypoint 목록 */
    .wp {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 12px;
    }

    .wp-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .wp-info {
      flex: 1;
    }

    .wp-prob {
      font-weight: bold;
    }

    #obs-list {
      font-size: 11px;
      color: var(--text-dim);
    }

    /* ── 드론 제어판 ── */
    #drone-card {
      border: 1px solid var(--border);
    }

    .seg {
      display: flex;
      gap: 0;
      margin-bottom: 8px;
    }

    .seg button {
      flex: 1;
      padding: 6px 4px;
      font-size: 12px;
      cursor: pointer;
      background: var(--card2);
      color: var(--text-dim);
      border: 1px solid var(--border);
      font-family: inherit;
    }

    .seg button:first-child {
      border-radius: 6px 0 0 6px;
    }

    .seg button:last-child {
      border-radius: 0 6px 6px 0;
      border-left: none;
    }

    .seg button.on {
      background: var(--accent);
      color: #fff;
      font-weight: bold;
    }

    .seg button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .btn {
      width: 100%;
      padding: 8px;
      font-size: 13px;
      font-family: inherit;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--card2);
      color: var(--text);
      cursor: pointer;
    }

    .btn:hover:not(:disabled) {
      border-color: var(--accent);
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .btn.go {
      background: #16a34a;
      border-color: #22c55e;
      color: #fff;
      font-weight: bold;
    }

    .btn.arm {
      background: #d97706;
      border-color: #fbbf24;
      color: #fff;
      font-weight: bold;
    }

    .why {
      font-size: 11px;
      color: #f59e0b;
      margin-top: 5px;
      line-height: 1.4;
    }

    .err {
      font-size: 11px;
      color: #ef4444;
      margin-top: 5px;
      line-height: 1.4;
      word-break: break-all;
    }

    .badge {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: bold;
      color: #fff;
    }

    .b-grey {
      background: #6b7280;
    }

    .b-amber {
      background: #d97706;
    }

    .b-blue {
      background: #2563eb;
    }

    .b-green {
      background: #16a34a;
    }

    .b-red {
      background: #dc2626;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .45
      }
    }

    .pulsing {
      animation: pulse 1.2s infinite;
    }

    .bar {
      height: 6px;
      border-radius: 3px;
      background: var(--card2);
      overflow: hidden;
      margin: 3px 0 7px;
    }

    .bar>i {
      display: block;
      height: 100%;
      background: var(--accent);
      transition: width .25s;
    }

    .params {
      display: flex;
      gap: 6px;
      margin: 8px 0;
    }

    .params label {
      flex: 1;
      font-size: 10px;
      color: var(--text-dim);
    }

    .params input {
      width: 100%;
      padding: 4px;
      margin-top: 2px;
      font-family: inherit;
      font-size: 12px;
      background: var(--card2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
    }

    #mission-list {
      font-size: 11px;
    }

    .mrow {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 3px;
    }

    .mchip {
      width: 17px;
      height: 17px;
      border-radius: 50%;
      flex-shrink: 0;
      font-size: 10px;
      font-weight: bold;
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ok {
      color: #22c55e;
    }

    .bad {
      color: #ef4444;
      font-weight: bold;
    }

    .warn-blocking {
      color: #ef4444;
    }

    .warn-info {
      color: #f59e0b;
    }

    #events {
      font-family: Consolas, monospace;
      font-size: 10.5px;
      line-height: 1.5;
      background: var(--card2);
      border-radius: 5px;
      padding: 6px;
      max-height: 120px;
      overflow-y: auto;
      color: var(--text-dim);
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>

<body>

  <div id="canvas-wrap">
    <canvas id="c"></canvas>

    <div id="toolbar">
      <div class="tbtn" id="btn-reset" onclick="resetView()" title="R">🏠 전체</div>
      <div class="tbtn" id="btn-map" onclick="fitToMap()" title="M">🗺 지도 영역</div>
      <div class="tbtn" id="btn-follow" onclick="toggleFollow()" title="F">📍 따라가기</div>
      <div class="tbtn" onclick="zoomAt(0.5)" title="+">＋</div>
      <div class="tbtn" onclick="zoomAt(-0.5)" title="-">－</div>
      <div class="tbtn" id="btn-theme" onclick="toggleTheme()" title="T">☾</div>
      <div class="tbtn" id="btn-takeoff" onclick="toggleTakeoffPick()" title="클릭 후 지도에서 이륙 지점 선택">🚁 이륙 지점</div>
    </div>

    <div id="estop" onclick="droneLand()" title="Esc 또는 L">🔴 착륙</div>

    <div id="coords">lat — lon —</div>
    <div id="hint">드래그: 이동 &nbsp;|&nbsp; 스크롤: 줌 &nbsp;|&nbsp; 클릭: 관측값 입력</div>
  </div>

  <div id="panel">
    <h2>Han River Drift</h2>
    <div id="conn" class="disconnected">● 연결 중...</div>

    <!-- ── 패널 탭 전환 (정보 / 드론을 별도 창처럼 분리) ── -->
    <div class="tabs">
      <button class="tab-btn active" id="tab-btn-info" onclick="switchPanelTab('info')" title="시뮬레이션·열화상·수색 정보">📊
        정보</button>
      <button class="tab-btn" id="tab-btn-drone" onclick="switchPanelTab('drone')" title="드론 연결·미션·조작">🚁 드론</button>
    </div>

    <div id="tab-info" class="tab-page">
      <!-- ── 시뮬레이션 상태 / 리셋 (POST /reset) ── -->
      <div class="card" id="sim-card">
        <h3>시뮬레이션</h3>
        <div id="sim-status" style="font-size:13px;margin-bottom:6px">대기 중 — 낙하 판정을 기다립니다</div>
        <button class="btn" onclick="resetSimulation()" title="기본 입수 지점으로 복원하고 대기 상태로 되돌림">🔄 대기 상태로 리셋</button>
        <div id="sim-error" class="err" style="display:none"></div>
      </div>

      <!-- ── 열화상 (arda-bringup이 report_url로 스트리밍) ── -->
      <div class="card" id="thermal-card">
        <h3 style="display:flex;align-items:center;justify-content:space-between">
          <span>열화상</span>
          <button id="thermal-zoom" onclick="openThermal()" title="크게 보기"
                  style="display:none">⛶</button>
        </h3>
        <div class="seg">
          <button id="t-abs"  class="on" onclick="setThermalView('absolute')">실제 온도</button>
          <button id="t-yolo"           onclick="setThermalView('yolo')">YOLO 시야</button>
        </div>
        <img id="thermal-img" onclick="openThermal()"
             style="width:100%;border-radius:6px;display:none;cursor:zoom-in">
        <div id="thermal-empty" style="font-size:12px;color:var(--text-dim)">수신 대기 중</div>
        <div id="thermal-meta" style="font-size:11px;margin-top:4px;color:var(--text-dim)"></div>
      </div>

      <div class="card">
        <h3>관측값 기록</h3>
        <div id="obs-list">없음</div>
      </div>

      <div class="card">
        <h3>최고 확률 예측 위치</h3>
        <div class="stat"><span>위도</span><span class="val" id="s-blat">-</span></div>
        <div class="stat"><span>경도</span><span class="val" id="s-blon">-</span></div>
      </div>

      <div class="card">
        <h3>수색 우선순위</h3>
        <div id="wp-list"></div>
      </div>

      <div class="card">
        <h3>범례</h3>
        <div id="legend" style="font-size:12px;line-height:1.9"></div>
      </div>

      <div class="card">
        <h3>시뮬레이션 상태</h3>
        <div class="stat"><span>경과 시간</span><span class="val" id="s-time">-</span></div>
        <div class="stat"><span>유속</span><span class="val" id="s-vel">-</span></div>
        <div class="stat"><span>강 내 파티클</span><span class="val" id="s-inriver">-</span></div>
        <div class="stat"><span>육지 도달</span><span class="val" id="s-stranded">-</span></div>
      </div>
    </div>

    <div id="tab-drone" class="tab-page" style="display:none">
      <!-- ── 드론 ── -->
      <div class="card" id="drone-card">
        <h3>드론 수색</h3>

        <div class="seg">
          <button id="m-dry" class="on" onclick="setMode('dry')">DRY RUN</button>
          <button id="m-real" onclick="setMode('real')">실기체</button>
        </div>
        <div class="seg">
          <button id="k-manual" class="on" onclick="setKind('manual')" title="지점을 골라 하나씩 이동. 이동 후에도 떠 있음">수동 이동</button>
          <button id="k-auto" onclick="setKind('auto')" title="TOP1→2→3→복귀 자동 순회 후 착륙">자동 순회</button>
        </div>
        <button class="btn" id="btn-connect" onclick="droneConnect()">연결</button>

        <div class="stat" style="margin-top:9px;align-items:center">
          <span>이륙 지점</span>
          <span class="val" style="display:flex;gap:6px;align-items:center">
            <span id="d-takeoff" style="font-size:11px">-</span>
            <button class="btn" style="width:auto;padding:2px 8px;font-size:11px" onclick="resetTakeoff()"
              title="지도 동쪽 변 바깥 기본 위치로">기본</button>
          </span>
        </div>

        <div class="stat">
          <span>상태</span><span class="val"><span id="d-phase" class="badge b-grey">idle</span></span>
        </div>
        <div class="stat"><span>배터리</span><span class="val" id="d-batt">-</span></div>
        <div class="bar"><i id="d-batt-bar" style="width:0%"></i></div>
        <div class="stat"><span>진행</span><span class="val" id="d-leg">-</span></div>
        <div class="bar"><i id="d-leg-bar" style="width:0%"></i></div>
        <div class="stat" id="d-result-row" style="display:none">
          <span>종료</span><span class="val"><span id="d-result" class="badge b-grey"></span></span>
        </div>
        <div class="err" id="d-error" style="display:none"></div>

        <div class="params">
          <label>지점 <input type="number" id="p-top" value="3" min="1" max="10" step="1"></label>
          <label>속도 <input type="number" id="p-speed" value="30" min="10" max="100" step="5"></label>
          <label>정지 <input type="number" id="p-hover" value="3" min="0" max="30" step="1"></label>
        </div>

        <div id="mission-list"></div>
        <div id="mission-meta" class="stat" style="margin-top:5px"></div>
        <div id="mission-warn"></div>

        <!-- 자동 순회 -->
        <button class="btn go" id="btn-start" style="margin-top:9px" onclick="onStartClick()">미션 시작</button>
        <!-- 수동 이동 -->
        <div id="manual-ctl" style="margin-top:9px;display:flex;gap:6px">
          <button class="btn go" id="btn-launch" onclick="onTakeoffClick()">이륙</button>
          <button class="btn" id="btn-home" style="flex:0 0 26%" onclick="droneHome()">복귀</button>
          <button class="btn" id="btn-clearpath" style="flex:0 0 26%" onclick="clearDronePath()"
            title="지도에 남은 경로 표시만 지웁니다">지우기</button>
        </div>
        <div class="why" id="start-why"></div>

        <h3 style="margin-top:11px">이벤트</h3>
        <div id="events">—</div>
      </div>

      <!-- ── 지도 설정 (드론 미션 좌표 변환의 기준이라 드론 탭에 둔다) ── -->
      <div class="card">
        <h3>실물 지도</h3>
        <div class="params">
          <label>가로 m <input type="number" id="mp-w" value="3" min="0.3" max="20" step="0.1"></label>
          <label>세로 m <input type="number" id="mp-h" value="2" min="0.3" max="20" step="0.1"></label>
          <label>축척 1: <input type="number" id="mp-s" value="150" min="10" max="2000" step="10"></label>
        </div>
        <div class="params" style="margin-top:0">
          <label>동쪽 여유 m (입수 지점 기준)
            <input type="number" id="mp-e" value="151.8" min="0" max="5000" step="10"></label>
          <label>남쪽 여유 m (입수 지점 기준)
            <input type="number" id="mp-so" value="91.4" min="0" max="5000" step="10"></label>
        </div>
        <div class="stat" id="mp-info"></div>
        <div style="display:flex;gap:6px;margin-top:6px">
          <button class="btn" id="mp-apply" onclick="applyMap()">적용</button>
          <button class="btn" style="flex:0 0 34%" onclick="resetMap()">기본</button>
        </div>
        <div class="why" id="mp-why"></div>
      </div>
    </div>
  </div>

  <script>
    'use strict';

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    // 위도 37.5° 부근 평면 근사 (hanriver.py / tello_mission.py 와 동일 상수)
    const M_LON = 88000, M_LAT = 111000;

    // ─────────────────────────────────────────────
    // 테마
    // ─────────────────────────────────────────────
    const PALETTES = {
      dark: {
        bg: '#0d1117',
        gridLabel: 'rgba(255,255,255,0.30)',
        scrim: 'rgba(5,8,14,0.55)',
        mapFrame: '#7dd3fc', mapText: 'rgba(190,225,255,0.9)',
        particle: 'rgba(255,160,50,0.55)',
        stranded: 'rgba(180,80,220,0.85)',
        trail: 'rgba(0,220,220,0.5)',
        best: '#00e5ff', entry: '#ff3333', markEdge: '#ffffff',
        obs: '#00ff66', obsPast: 'rgba(0,255,100,0.35)',
        pathDone: '#22c55e', pathTodo: 'rgba(255,255,255,0.30)', pathSkip: 'rgba(160,160,160,0.55)',
        drone: '#38bdf8', takeoff: '#a3e635',
        text: 'rgba(255,255,255,0.78)', textDim: 'rgba(255,255,255,0.45)',
        // 히트맵(inferno)이 주황·노랑을 쓰므로 waypoint 링은 한색 계열로 피한다
        wp: ['#ffffff', '#7dd3fc', '#c084fc', '#f472b6', '#4ade80', '#22d3ee', '#a78bfa', '#67e8f9', '#e879f9', '#cbd5e1'],
        wpText: '#000000',
      },
      light: {
        bg: '#f8fafc',
        gridLabel: 'rgba(0,0,0,0.45)',
        scrim: 'rgba(248,250,252,0.68)',
        mapFrame: '#0369a1', mapText: 'rgba(12,60,100,0.95)',
        particle: 'rgba(217,95,14,0.65)',
        stranded: 'rgba(126,34,206,0.85)',
        trail: 'rgba(8,145,178,0.65)',
        best: '#0369a1', entry: '#dc2626', markEdge: '#1e293b',
        obs: '#15803d', obsPast: 'rgba(21,128,61,0.35)',
        pathDone: '#15803d', pathTodo: 'rgba(30,41,59,0.30)', pathSkip: 'rgba(100,116,139,0.6)',
        drone: '#0369a1', takeoff: '#4d7c0f',
        text: 'rgba(15,23,42,0.85)', textDim: 'rgba(15,23,42,0.55)',
        // 히트맵(YlOrRd)이 노랑·주황·빨강을 쓰므로 waypoint 링은 진한 한색으로
        wp: ['#0f172a', '#0369a1', '#7e22ce', '#be185d', '#15803d', '#0891b2', '#6d28d9', '#0e7490', '#a21caf', '#475569'],
        wpText: '#ffffff',
      },
    };

    // 히트맵 컬러맵 — 배경 대비 휘도가 값과 함께 "멀어지는" 방향이어야 한다.
    // 어두운 배경에선 고확률이 밝게(inferno), 밝은 배경에선 고확률이 진하게(YlOrRd).
    const CMAP = {
      dark: [[0, 0, 4], [11, 7, 45], [46, 10, 90], [85, 15, 109], [124, 29, 111],
      [164, 45, 96], [201, 66, 74], [230, 98, 45], [247, 138, 18], [252, 188, 42], [252, 255, 164]],
      light: [[255, 255, 229], [255, 247, 188], [254, 227, 145], [254, 196, 79], [254, 153, 41],
      [236, 112, 20], [204, 76, 2], [153, 52, 4], [120, 32, 4], [90, 20, 10], [60, 10, 10]],
    };

    let theme = localStorage.getItem('theme')
      || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    let C = PALETTES[theme];

    function applyTheme() {
      C = PALETTES[theme];
      document.body.dataset.theme = theme;
      document.getElementById('btn-theme').textContent = theme === 'dark' ? '☾' : '☀';
      buildLegend();
      requestRender();
    }
    function toggleTheme() {
      theme = theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', theme);
      applyTheme();
    }

    // ── 패널 탭 (정보 / 드론을 별도 창처럼 분리) ──
    let panelTab = localStorage.getItem('panelTab') || 'info';
    function switchPanelTab(name) {
      panelTab = name;
      localStorage.setItem('panelTab', name);
      const isInfo = name === 'info';
      document.getElementById('tab-info').style.display = isInfo ? '' : 'none';
      document.getElementById('tab-drone').style.display = isInfo ? 'none' : '';
      document.getElementById('tab-btn-info').classList.toggle('active', isInfo);
      document.getElementById('tab-btn-drone').classList.toggle('active', !isInfo);
    }
    switchPanelTab(panelTab);
    const wpColor = i => C.wp[i % C.wp.length];

    // ─────────────────────────────────────────────
    // 뷰 / 투영
    // ─────────────────────────────────────────────
    // 서버의 state.bounds 가 오면 교체된다. 첫 프레임 전 부트스트랩 값.
    let INIT = { lonMin: 126.900, lonMax: 126.918, latMin: 37.537, latMax: 37.546 };
    let view = { ...INIT };
    let boundsAdopted = false, mapFitted = false;

    let W = 1, H = 1;
    let state = null, autoFollow = false;

    // 실물 지도 배경 사진(마포/밤섬 항공뷰) — 지도 사각형(m.lon_min~lon_max,
    // m.lat_min~lat_max) 안을 그대로 채워서 드론 활동 지도로 쓴다. 로드되기
    // 전에는 그리지 않고(mapBgLoaded), 로드가 끝나면 그 프레임을 다시
    // 그리도록 requestRender()를 한 번 걸어준다.
    let mapBgLoaded = false;
    const mapBgImg = new Image();
    mapBgImg.onload = () => { mapBgLoaded = true; requestRender(); };
    mapBgImg.src = '/static/mapomap.jpg';

    // 경도 1° 와 위도 1° 의 실제 길이가 다르므로(88km vs 111km) 화면에도 그 비율을
    // 반영해야 실물 지도 사각형이 정확한 3:2 로 보인다.
    const proj = { lon0: 0, lat0: 0, mx: 1, my: 1 };

    function updateProjection() {
      const spanE = (view.lonMax - view.lonMin) * M_LON;
      const spanN = (view.latMax - view.latMin) * M_LAT;
      const ppm = Math.min(W / spanE, H / spanN);   // 요청 영역이 다 들어가도록
      proj.mx = ppm * M_LON;
      proj.my = ppm * M_LAT;
      proj.lon0 = (view.lonMin + view.lonMax) / 2 - (W / 2) / proj.mx;
      proj.lat0 = (view.latMin + view.latMax) / 2 - (H / 2) / proj.my;
    }
    function toCanvas(lon, lat) {
      return [(lon - proj.lon0) * proj.mx, H - (lat - proj.lat0) * proj.my];
    }
    function fromCanvas(px, py) {
      return { lon: proj.lon0 + px / proj.mx, lat: proj.lat0 + (H - py) / proj.my };
    }
    function setView(lonMin, lonMax, latMin, latMax) {
      view = { lonMin, lonMax, latMin, latMax };
      updateProjection();
    }

    function resetView() {
      setView(INIT.lonMin, INIT.lonMax, INIT.latMin, INIT.latMax);
      autoFollow = false;
      document.getElementById('btn-follow').classList.remove('active');
      requestRender();
    }
    function fitToMap() {
      const m = state && state.map;
      if (!m) return;
      const padL = (m.lon_max - m.lon_min) * 0.15, padT = (m.lat_max - m.lat_min) * 0.15;
      setView(m.lon_min - padL, m.lon_max + padL, m.lat_min - padT, m.lat_max + padT);
      autoFollow = false;
      document.getElementById('btn-follow').classList.remove('active');
      requestRender();
    }
    function toggleFollow() {
      autoFollow = !autoFollow;
      document.getElementById('btn-follow').classList.toggle('active', autoFollow);
      requestRender();
    }
    function zoomAt(deltaZ, cx, cy) {
      const factor = Math.pow(2, -deltaZ * 0.8);
      const p = (cx !== undefined) ? fromCanvas(cx, cy)
        : { lon: (view.lonMin + view.lonMax) / 2, lat: (view.latMin + view.latMax) / 2 };
      view.lonMin = p.lon + (view.lonMin - p.lon) * factor;
      view.lonMax = p.lon + (view.lonMax - p.lon) * factor;
      view.latMin = p.lat + (view.latMin - p.lat) * factor;
      view.latMax = p.lat + (view.latMax - p.lat) * factor;
      if (cx !== undefined) {
        // 최소맞춤 투영은 레터박스가 생기므로, 커서 아래 지점이 제자리에 남도록 보정
        updateProjection();
        const [nx, ny] = toCanvas(p.lon, p.lat);
        const dLon = (nx - cx) / proj.mx, dLat = (cy - ny) / proj.my;
        view.lonMin += dLon; view.lonMax += dLon;
        view.latMin += dLat; view.latMax += dLat;
      }
      updateProjection();
      requestRender();
    }
    function panBy(dLon, dLat) {
      view.lonMin += dLon; view.lonMax += dLon;
      view.latMin += dLat; view.latMax += dLat;
      updateProjection();
      requestRender();
    }

    // ─────────────────────────────────────────────
    // 입력
    // ─────────────────────────────────────────────
    const drag = { on: false, x0: 0, y0: 0, lon0: 0, lat0: 0, moved: false };

    function canvasPos(e) {
      const r = canvas.getBoundingClientRect();
      return [e.clientX - r.left, e.clientY - r.top];
    }

    canvas.addEventListener('mousedown', e => {
      if (e.button !== 0) return;
      drag.on = true; drag.moved = false;
      drag.x0 = e.clientX; drag.y0 = e.clientY;
      drag.lon0 = view.lonMin; drag.lat0 = view.latMin;
      canvas.style.cursor = 'grabbing';
    });

    window.addEventListener('mousemove', e => {
      const [px, py] = canvasPos(e);
      const { lon, lat } = fromCanvas(px, py);
      setText('coords', `lat ${lat.toFixed(5)}  lon ${lon.toFixed(5)}`);
      if (!drag.on) return;

      const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
        drag.moved = true;
        if (autoFollow) { autoFollow = false; document.getElementById('btn-follow').classList.remove('active'); }
      }
      const span = view.lonMax - view.lonMin, spanLat = view.latMax - view.latMin;
      view.lonMin = drag.lon0 - dx / proj.mx; view.lonMax = view.lonMin + span;
      view.latMin = drag.lat0 + dy / proj.my; view.latMax = view.latMin + spanLat;
      updateProjection();
      requestRender();
    });

    window.addEventListener('mouseup', e => {
      if (!drag.on) return;
      drag.on = false;
      canvas.style.cursor = takeoffPick ? 'copy' : 'crosshair';
      if (drag.moved || e.button !== 0 || e.target !== canvas) return;

      const [px, py] = canvasPos(e);
      const { lon, lat } = fromCanvas(px, py);

      if (takeoffPick) {
        // 이륙 지점 지정 모드 — 관측값 입력이 아니다
        postJSON('/takeoff', { lon, lat })
          .then(() => { setTakeoffPick(false); showError(null); })
          .catch(err => { showError(err.message); setTakeoffPick(false); });
        return;
      }
      fetch('/observation', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ lon, lat }),
      }).catch(err => console.warn('관측값 전송 실패', err));
    });

    // ── 지도 설정 ──
    const numVal = (id, dflt) => {
      const n = parseFloat(document.getElementById(id).value);
      return isNaN(n) ? dflt : n;
    };

    async function applyMap() {
      const body = {
        width_m: numVal('mp-w', 3),
        height_m: numVal('mp-h', 2),
        scale: numVal('mp-s', 150),
        east_m: numVal('mp-e', 50),
        south_m: numVal('mp-so', 150),
      };
      const btn = document.getElementById('mp-apply');
      btn.disabled = true;
      try {
        await postJSON('/map', body);
        setText('mp-why', '');
        mapFitted = false;          // 새 영역으로 화면을 다시 맞춘다
      } catch (e) {
        setText('mp-why', e.message);
      } finally {
        btn.disabled = false;
      }
    }

    async function resetMap() {
      try {
        await postJSON('/map/reset');
        setText('mp-why', '');
        mapFitted = false;
      } catch (e) { setText('mp-why', e.message); }
    }

    // 서버가 실제로 적용한 값을 입력칸에 반영한다 (첫 수신 시 1회)
    let mapInputsSynced = false;
    function syncMapPanel(m) {
      if (!m) return;
      if (!mapInputsSynced) {
        mapInputsSynced = true;
        document.getElementById('mp-w').value = m.width_m;
        document.getElementById('mp-h').value = m.height_m;
        document.getElementById('mp-s').value = m.scale;
        document.getElementById('mp-e').value = m.east_m;
        document.getElementById('mp-so').value = m.south_m;
      }
      setHTML('mp-info',
        `<span>덮는 실제 영역</span>
     <span class="val">${Math.round(m.real_w_m)} × ${Math.round(m.real_h_m)} m</span>`);
    }

    // ── 이륙 지점 지정 ──
    let takeoffPick = false;
    function setTakeoffPick(on) {
      takeoffPick = on;
      document.getElementById('btn-takeoff').classList.toggle('active', on);
      canvas.style.cursor = on ? 'copy' : 'crosshair';
      setText('hint', on
        ? '지도에서 드론을 놓을 자리를 클릭하세요  (Esc 취소)'
        : '드래그: 이동  |  스크롤: 줌  |  클릭: 관측값 입력');
      requestRender();
    }
    function toggleTakeoffPick() {
      if (droneStatus && droneStatus.running) return;   // 비행 중 변경 금지
      setTakeoffPick(!takeoffPick);
    }
    function resetTakeoff() {
      postJSON('/takeoff/reset').then(() => showError(null)).catch(e => showError(e.message));
    }

    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      const [cx, cy] = canvasPos(e);
      zoomAt(e.deltaY > 0 ? -0.3 : 0.3, cx, cy);
      if (autoFollow) { autoFollow = false; document.getElementById('btn-follow').classList.remove('active'); }
    }, { passive: false });

    window.addEventListener('keydown', e => {
      // 드론 파라미터 입력칸에서 r/f/m 이 뷰를 건드리면 안 된다
      if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
      const PL = (view.lonMax - view.lonMin) * 0.15, PT = (view.latMax - view.latMin) * 0.15;
      const k = e.key.toLowerCase();
      if (e.key === 'ArrowLeft') panBy(-PL, 0);
      else if (e.key === 'ArrowRight') panBy(+PL, 0);
      else if (e.key === 'ArrowUp') panBy(0, +PT);
      else if (e.key === 'ArrowDown') panBy(0, -PT);
      else if (e.key === '+' || e.key === '=') zoomAt(0.5);
      else if (e.key === '-') zoomAt(-0.5);
      else if (k === 'r') resetView();
      else if (k === 'f') toggleFollow();
      else if (k === 'm') fitToMap();
      else if (k === 't') toggleTheme();
      else if (e.key === 'Escape') {
        // 지정 모드 중이면 취소가 우선, 아니면 비상 착륙
        if (takeoffPick) setTakeoffPick(false); else droneLand();
      }
      else if (k === 'l') droneLand();
    });

    // ─────────────────────────────────────────────
    // 히트맵 색상
    // ─────────────────────────────────────────────
    function heatColor(v, vmax) {
      if (!(vmax > 0) || v < 0.015 * vmax) return null;
      const t = Math.pow(Math.min(1, v / vmax), 0.6);   // 롱테일이라 감마로 중간을 들어올린다
      const st = CMAP[theme];
      const f = t * (st.length - 1);
      const i = Math.min(st.length - 2, Math.floor(f));
      const u = f - i;
      const a = st[i], b = st[i + 1];
      const r = Math.round(a[0] + (b[0] - a[0]) * u);
      const g = Math.round(a[1] + (b[1] - a[1]) * u);
      const bl = Math.round(a[2] + (b[2] - a[2]) * u);
      const al = theme === 'dark' ? 0.25 + 0.60 * t : 0.35 + 0.55 * t;
      return `rgba(${r},${g},${bl},${al.toFixed(3)})`;
    }

    // 자동 스케일. 관측 클릭 직후엔 최고 칸이 50%를 넘고 정상 상태에선 1~3% 라
    // 고정 vmax 로는 양쪽을 못 맞춘다. 상승은 빠르게, 하강은 느리게.
    let vmaxEMA = null;
    function updateScale(s) {
      const v = s.waypoints && s.waypoints.length ? s.waypoints[0].prob : null;
      if (v == null || !(v > 0)) return;
      vmaxEMA = (vmaxEMA == null) ? v : vmaxEMA + (v - vmaxEMA) * (v > vmaxEMA ? 0.5 : 0.05);
    }

    // ─────────────────────────────────────────────
    // 그리기
    // ─────────────────────────────────────────────
    // 실물 지도 배경 사진 — 지도 사각형 안을 그 사진으로 그대로 채운다.
    // 좌표 격자·강 폴리곤 등 예전에 배경으로 그리던 요소는 다 걷어내고, 이
    // 사진 하나만 지도 사각형의 배경이 된다(사각형 밖은 계속 스크림 처리).
    function drawMapBackground(m) {
      if (!m || !mapBgLoaded) return;
      const [x1, y1] = toCanvas(m.lon_min, m.lat_max);
      const [x2, y2] = toCanvas(m.lon_max, m.lat_min);
      ctx.drawImage(mapBgImg, x1, y1, x2 - x1, y2 - y1);
    }

    // 실물 지도 밖을 죽인다. 드론은 이 사각형 밖으로 나갈 수 없다.
    function drawMapScrim(m) {
      if (!m) return;
      const [x1, y1] = toCanvas(m.lon_min, m.lat_max);
      const [x2, y2] = toCanvas(m.lon_max, m.lat_min);
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, W, H);
      ctx.rect(x1, y1, x2 - x1, y2 - y1);
      ctx.fillStyle = C.scrim;
      ctx.fill('evenodd');
      ctx.restore();
    }

    function drawMapFrame(m) {
      if (!m) return;
      const [x1, y1] = toCanvas(m.lon_min, m.lat_max);
      const [x2, y2] = toCanvas(m.lon_max, m.lat_min);
      const w = x2 - x1, h = y2 - y1;

      ctx.save();
      ctx.strokeStyle = C.mapFrame; ctx.lineWidth = 2; ctx.setLineDash([7, 5]);
      ctx.strokeRect(x1, y1, w, h);
      ctx.setLineDash([]);

      // 인쇄 지도 눈금. 지도 크기에 따라 간격을 키워 과밀해지지 않게 한다.
      const big = Math.max(m.width_m, m.height_m);
      const tick = big <= 4 ? 0.5 : big <= 10 ? 1 : 2;   // 실물 m
      const stepLon = (m.lon_max - m.lon_min) / (m.width_m / tick);
      const stepLat = (m.lat_max - m.lat_min) / (m.height_m / tick);
      ctx.lineWidth = 1;
      for (let i = 1; i < Math.round(m.width_m / tick); i++) {
        const [x] = toCanvas(m.lon_min + stepLon * i, 0);
        ctx.beginPath(); ctx.moveTo(x, y2); ctx.lineTo(x, y2 - 7); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x, y1); ctx.lineTo(x, y1 + 7); ctx.stroke();
      }
      for (let i = 1; i < Math.round(m.height_m / tick); i++) {
        const [, y] = toCanvas(0, m.lat_min + stepLat * i);
        ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x1 + 7, y); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x2, y); ctx.lineTo(x2 - 7, y); ctx.stroke();
      }

      ctx.fillStyle = C.mapText; ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
      ctx.fillText(`실물 지도 ${m.width_m} × ${m.height_m} m (1:${m.scale})`, x1, y1 - 5);
      ctx.font = '10px sans-serif'; ctx.textBaseline = 'top';
      ctx.fillText(`눈금 ${tick} m = 실제 ${Math.round(m.scale * tick)} m`, x1, y2 + 5);
      ctx.restore();
    }

    function drawHeatmap(hm, ext, vmax) {
      if (!hm || !hm.length || !ext) return;
      const rows = hm.length, cols = hm[0].length;
      const [lo, hi, la, ha] = ext;
      const dLon = (hi - lo) / cols, dLat = (ha - la) / rows;
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
        const color = heatColor(hm[r][c], vmax);
        if (!color) continue;
        const [xa, ya] = toCanvas(lo + c * dLon, la + (r + 1) * dLat);
        const [xb, yb] = toCanvas(lo + (c + 1) * dLon, la + r * dLat);
        ctx.fillStyle = color;
        ctx.fillRect(xa, ya, xb - xa + 0.5, yb - ya + 0.5);
      }
    }

    const onScreen = (x, y) => x > -12 && x < W + 12 && y > -12 && y < H + 12;

    function drawParticles(lons, lats) {
      ctx.fillStyle = C.particle;
      for (let i = 0; i < lons.length; i++) {
        const [x, y] = toCanvas(lons[i], lats[i]);
        if (!onScreen(x, y)) continue;
        ctx.beginPath(); ctx.arc(x, y, 2.2, 0, Math.PI * 2); ctx.fill();
      }
    }
    function drawStranded(lons, lats) {
      ctx.strokeStyle = C.stranded; ctx.lineWidth = 1.2;
      for (let i = 0; i < lons.length; i++) {
        const [x, y] = toCanvas(lons[i], lats[i]);
        if (!onScreen(x, y)) continue;
        ctx.beginPath();
        ctx.moveTo(x - 4, y - 4); ctx.lineTo(x + 4, y + 4);
        ctx.moveTo(x + 4, y - 4); ctx.lineTo(x - 4, y + 4);
        ctx.stroke();
      }
    }
    function drawTrail(lons, lats) {
      if (lons.length < 2) return;
      ctx.strokeStyle = C.trail; ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]);
      ctx.beginPath();
      for (let i = 0; i < lons.length; i++) {
        const [x, y] = toCanvas(lons[i], lats[i]);
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke(); ctx.setLineDash([]);
    }
    function drawDiamond(x, y, s, color) {
      ctx.fillStyle = color; ctx.beginPath();
      ctx.moveTo(x, y - s); ctx.lineTo(x + s, y); ctx.lineTo(x, y + s); ctx.lineTo(x - s, y);
      ctx.closePath(); ctx.fill();
    }
    function drawStar(x, y, r, color) {
      ctx.fillStyle = color; ctx.strokeStyle = C.markEdge; ctx.lineWidth = 0.8;
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const a = i * Math.PI / 5 - Math.PI / 2, d = i % 2 === 0 ? r : r * 0.4;
        const px = x + Math.cos(a) * d, py = y + Math.sin(a) * d;
        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    function drawTriangle(x, y, s, color) {
      ctx.fillStyle = color; ctx.strokeStyle = C.markEdge; ctx.lineWidth = 0.6;
      ctx.beginPath();
      ctx.moveTo(x, y - s); ctx.lineTo(x + s, y + s * 0.7); ctx.lineTo(x - s, y + s * 0.7);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    function drawWaypoints(wps, n) {
      // 수동 모드에서 이미 다녀온 지점은 체크로 표시한다 (지령 자취와 대조)
      const visited = [];
      if (droneKind === 'manual' && droneStatus && droneStatus.path && state && state.map) {
        const m = state.map;
        wps.slice(0, n).forEach((wp, i) => {
          const hit = droneStatus.path.some(([px, py]) => {
            const [lon, lat] = droneCmToLonLat(m, px, py);
            return Math.abs(lon - wp.lon) * M_LON < 8 && Math.abs(lat - wp.lat) * M_LAT < 8;
          });
          if (hit) visited[i] = true;
        });
      }

      wps.slice(0, n).forEach((wp, i) => {
        const [x, y] = toCanvas(wp.lon, wp.lat);
        ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI * 2);
        ctx.fillStyle = wpColor(i) + '55';
        ctx.strokeStyle = wpColor(i);
        ctx.lineWidth = i === 0 ? 3 : 2;
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = C.wpText; ctx.font = 'bold 9px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(String(i + 1), x, y);

        if (visited[i]) {
          ctx.strokeStyle = C.pathDone; ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.moveTo(x + 5, y + 10); ctx.lineTo(x + 8, y + 13); ctx.lineTo(x + 14, y + 5);
          ctx.stroke();
        }
      });
    }

    // ── 비행 경로 ────────────────────────────────
    function legEndpoints(mission, m) {
      // legs 순서대로 (이륙점 → WP… → 이륙점) 의 절대 위치를 만든다.
      // 드론은 입수 지점이 아니라 이륙 지점에서 출발한다. origin 을 쓰면
      // 경로가 통째로 어긋난 자리에 그려진다.
      const t = takeoffPt(m);
      const pts = [t];
      for (const leg of mission.legs) {
        if (leg.to_rank === 0) { pts.push(t); continue; }
        const p = mission.points.find(q => q.rank === leg.to_rank);
        pts.push(p ? [p.lon, p.lat] : pts[pts.length - 1]);
      }
      return pts;
    }

    // 이륙 지점 (Tello 기체 좌표의 0,0). 서버가 안 주면 입수 지점으로 대체.
    function takeoffPt(m) {
      return (m && m.takeoff_lon != null)
        ? [m.takeoff_lon, m.takeoff_lat]
        : [m.origin_lon, m.origin_lat];
    }

    function drawFlightPath(mission, st, m) {
      if (!mission || !mission.legs || !m) return;
      const pts = legEndpoints(mission, m);
      const done = st ? st.leg_done : 0;
      let executed = 0;

      mission.legs.forEach((leg, i) => {
        const [ax, ay] = toCanvas(pts[i][0], pts[i][1]);
        const [bx, by] = toCanvas(pts[i + 1][0], pts[i + 1][1]);

        if (leg.skip) {
          ctx.strokeStyle = C.pathSkip; ctx.lineWidth = 1.2; ctx.setLineDash([2, 4]);
        } else {
          const isDone = executed < done;
          const isCur = executed === done && st && st.running;
          ctx.strokeStyle = isDone ? C.pathDone : C.pathTodo;
          ctx.lineWidth = isDone ? 2.5 : 1.6;
          ctx.setLineDash(isDone ? [] : [6, 5]);
          if (isCur) ctx.lineDashOffset = -(performance.now() / 60) % 11;
          executed++;
        }
        ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
        ctx.setLineDash([]); ctx.lineDashOffset = 0;

        const mx = (ax + bx) / 2, my = (ay + by) / 2;
        if (leg.skip) {
          ctx.strokeStyle = C.pathSkip; ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.moveTo(mx - 4, my - 4); ctx.lineTo(mx + 4, my + 4);
          ctx.moveTo(mx + 4, my - 4); ctx.lineTo(mx - 4, my + 4);
          ctx.stroke();
        } else if (Math.hypot(bx - ax, by - ay) > 24) {
          // 순회 "순서"가 요점이므로 방향 화살촉을 찍는다
          const a = Math.atan2(by - ay, bx - ax);
          ctx.fillStyle = ctx.strokeStyle;
          ctx.beginPath();
          ctx.moveTo(mx + Math.cos(a) * 6, my + Math.sin(a) * 6);
          ctx.lineTo(mx + Math.cos(a + 2.6) * 6, my + Math.sin(a + 2.6) * 6);
          ctx.lineTo(mx + Math.cos(a - 2.6) * 6, my + Math.sin(a - 2.6) * 6);
          ctx.closePath(); ctx.fill();
        }
      });
    }

    // 수동 모드는 경로가 미리 정해지지 않는다. "예정 경로" 대신
    // 서버가 기록한 지령 위치의 자취(실제 지나간 길)를 그린다.
    function droneCmToLonLat(m, x_cm, y_cm) {
      const [t0lon, t0lat] = takeoffPt(m);
      return [t0lon + (-y_cm / 100 * m.scale) / M_LON,
      t0lat + (x_cm / 100 * m.scale) / M_LAT];
    }

    function drawDronePath(st, m) {
      if (!st || !m || !st.path || st.path.length < 2) return;
      const pts = st.path.map(([x, y]) => toCanvas(...droneCmToLonLat(m, x, y)));

      ctx.save();
      ctx.strokeStyle = C.pathDone; ctx.lineWidth = 2.5;
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.beginPath();
      pts.forEach(([x, y], i) => (i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y)));
      ctx.stroke();

      // 경유한 지점마다 작은 표식 (출발점 제외)
      ctx.fillStyle = C.pathDone;
      pts.slice(1).forEach(([x, y]) => {
        ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
      });

      // 이동 중이면 마지막 지점에서 현재 지령 위치까지 파선으로 잇는다
      if (st.running) {
        const [lx, ly] = pts[pts.length - 1];
        const [cx, cy] = toCanvas(...droneCmToLonLat(m, st.cur_x_cm, st.cur_y_cm));
        if (Math.hypot(cx - lx, cy - ly) > 3) {
          ctx.strokeStyle = C.pathTodo; ctx.lineWidth = 1.8;
          ctx.setLineDash([6, 5]);
          ctx.lineDashOffset = -(performance.now() / 60) % 11;
          ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(cx, cy); ctx.stroke();
          ctx.setLineDash([]); ctx.lineDashOffset = 0;
        }
      }
      ctx.restore();
    }

    // 드론 이륙 지점 = Tello 기체 좌표의 (0,0). 입수 지점(★)과는 다른 점이다.
    function drawTakeoff(m) {
      if (!m || m.takeoff_lon == null) return;
      const [x, y] = toCanvas(m.takeoff_lon, m.takeoff_lat);
      ctx.save();
      ctx.strokeStyle = C.takeoff; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(x, y, 15, 0, Math.PI * 2);
      ctx.setLineDash([3, 3]); ctx.stroke(); ctx.setLineDash([]);
      // 헬리패드 H
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(x - 4, y - 5); ctx.lineTo(x - 4, y + 5);
      ctx.moveTo(x + 4, y - 5); ctx.lineTo(x + 4, y + 5);
      ctx.moveTo(x - 4, y); ctx.lineTo(x + 4, y);
      ctx.stroke();
      ctx.fillStyle = C.takeoff; ctx.font = 'bold 10px sans-serif';
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText('이륙 지점 (0,0)', x + 19, y);
      ctx.restore();
    }

    // Tello 는 절대 위치 센서가 없다. 이건 "지령" 위치이지 측정 위치가 아니다.
    function drawDroneMarker(st, m) {
      if (!st || !m || !st.connected) return;
      if (!st.running && !(st.leg_done > 0)) return;
      // cur_x/cur_y 는 "이륙 지점" 기준 상대 좌표다 (Tello 기체 좌표계의 0,0).
      // 입수 지점을 기준으로 환산하면 마커가 통째로 어긋난다.
      const [t0lon, t0lat] = takeoffPt(m);
      const lon = t0lon + (-st.cur_y_cm / 100 * m.scale) / M_LON;
      const lat = t0lat + (st.cur_x_cm / 100 * m.scale) / M_LAT;
      const [x, y] = toCanvas(lon, lat);

      ctx.save();
      if (st.phase === 'flying' || st.phase === 'takeoff') {
        const p = 0.5 + 0.5 * Math.sin(performance.now() / 260);
        ctx.strokeStyle = C.drone; ctx.globalAlpha = 0.25 + 0.45 * p; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(x, y, 12 + 5 * p, 0, Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = 1;
      }
      ctx.strokeStyle = C.drone; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2); ctx.stroke();
      // 기수는 설계상 정북 고정이므로 방향 셰브론도 고정이다
      ctx.fillStyle = C.drone;
      ctx.beginPath();
      ctx.moveTo(x, y - 13); ctx.lineTo(x + 5, y - 5); ctx.lineTo(x - 5, y - 5);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = C.text; ctx.font = '10px sans-serif';
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText('지령 위치', x + 13, y);
      ctx.restore();
    }

    function drawColorbar(vmax) {
      if (!(vmax > 0)) return;
      const w = 140, h = 10, x = W - w - 16, y = H - 34;
      const g = ctx.createLinearGradient(x, 0, x + w, 0);
      for (let i = 0; i <= 16; i++) {
        const c = heatColor((i / 16) * vmax * 0.999 + 0.02 * vmax, vmax);
        if (c) g.addColorStop(i / 16, c);
      }
      ctx.save();
      ctx.fillStyle = C.scrim;
      ctx.fillRect(x - 8, y - 16, w + 16, h + 32);
      ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = C.gridLabel; ctx.lineWidth = 0.6; ctx.strokeRect(x, y, w, h);
      ctx.fillStyle = C.textDim; ctx.font = '9px monospace';
      ctx.textBaseline = 'top'; ctx.textAlign = 'left';
      ctx.fillText('0', x, y + h + 2);
      ctx.textAlign = 'center'; ctx.fillText((vmax / 2).toFixed(1) + '%', x + w / 2, y + h + 2);
      ctx.textAlign = 'right'; ctx.fillText(vmax.toFixed(1) + '%', x + w, y + h + 2);
      ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
      ctx.fillText('셀당 확률 (자동 스케일)', x, y - 3);
      ctx.restore();
    }

    // ─────────────────────────────────────────────
    // 렌더
    // ─────────────────────────────────────────────
    let _pending = false;
    function requestRender() {
      if (_pending) return;
      _pending = true;
      requestAnimationFrame(() => { _pending = false; render(); });
    }

    function render() {
      if (!state || state.elapsed_sec === undefined) return;
      const s = state, m = s.map;

      if (autoFollow && s.best_lon != null) {
        const lw = view.lonMax - view.lonMin, lh = view.latMax - view.latMin;
        view.lonMin = s.best_lon - lw / 2; view.lonMax = s.best_lon + lw / 2;
        view.latMin = s.best_lat - lh / 2; view.latMax = s.best_lat + lh / 2;
      }
      updateProjection();

      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);

      drawMapBackground(m);
      drawMapScrim(m);
      drawHeatmap(s.heatmap, s.heatmap_extent, vmaxEMA);
      drawStranded(s.stranded_lons || [], s.stranded_lats || []);
      drawTrail(s.best_trail_lons || [], s.best_trail_lats || []);
      drawParticles(s.particles_lon || [], s.particles_lat || []);

      (s.obs_history || []).slice(0, -1).forEach(([lon, lat]) => {
        const [x, y] = toCanvas(lon, lat);
        drawTriangle(x, y, 6, C.obsPast);
      });
      if (s.observation) {
        const [x, y] = toCanvas(s.observation[0], s.observation[1]);
        drawTriangle(x, y, 8, C.obs);
        ctx.strokeStyle = C.obs; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(x, y, 14, 0, Math.PI * 2); ctx.stroke();
      }

      if (s.best_lon != null) {
        const [bx, by] = toCanvas(s.best_lon, s.best_lat);
        drawDiamond(bx, by, 7, C.best);
      }

      drawWaypoints(s.waypoints || [], topN());

      if (m) {
        const [ex, ey] = toCanvas(m.origin_lon, m.origin_lat);
        drawStar(ex, ey, 10, C.entry);
        ctx.fillStyle = C.mapText; ctx.font = '10px sans-serif';
        ctx.textAlign = 'left'; ctx.textBaseline = 'top';
        ctx.fillText('입수 지점 = 드론 원점 (0,0)', ex + 13, ey - 4);
      } else if (s.entry_lon != null) {
        const [ex, ey] = toCanvas(s.entry_lon, s.entry_lat);
        drawStar(ex, ey, 10, C.entry);
      }

      // 자동은 미리 정해진 경로, 수동은 실제 지나간 자취
      if (droneKind === 'auto') drawFlightPath(mission, droneStatus, m);
      else drawDronePath(droneStatus, m);
      drawTakeoff(m);
      drawDroneMarker(droneStatus, m);
      drawMapFrame(m);
      drawColorbar(vmaxEMA);

      updatePanel(s);

      // 비행 중에는 파선 애니메이션과 맥동을 위해 계속 돌린다
      if (droneStatus && droneStatus.running) requestRender();
    }

    // ─────────────────────────────────────────────
    // 패널 (변경 감지 후에만 DOM 을 건드린다)
    // ─────────────────────────────────────────────
    const _last = {};
    function setText(id, v) {
      if (_last[id] === v) return;
      _last[id] = v;
      const el = document.getElementById(id);
      if (el) el.textContent = v;
    }
    function setHTML(id, v) {
      if (_last['h:' + id] === v) return;
      _last['h:' + id] = v;
      const el = document.getElementById(id);
      if (el) el.innerHTML = v;
    }

    function updatePanel(s) {
      const mins = Math.floor(s.elapsed_sec / 60), secs = Math.floor(s.elapsed_sec % 60);
      setText('s-time', `T + ${mins}분 ${String(secs).padStart(2, '0')}초`);

      const vx = s.velocity_x || 0;
      setText('s-vel', `${Math.abs(vx).toFixed(4)} m/s (${vx < 0 ? '서쪽' : vx > 0 ? '동쪽' : '정지'})`);

      setText('s-inriver', s.n_particles != null
        ? `${s.in_river_count} / ${s.n_particles}` : `${s.in_river_count} 개`);
      setText('s-stranded', `${s.stranded_count != null ? s.stranded_count : (s.stranded_lons || []).length} 개`);

      setText('s-blat', s.best_lat != null ? s.best_lat.toFixed(6) : '-');
      setText('s-blon', s.best_lon != null ? s.best_lon.toFixed(6) : '-');

      const wps = (s.waypoints || []).slice(0, topN());
      setHTML('wp-list', wps.map((wp, i) => `
    <div class="wp">
      <div class="wp-dot" style="background:${wpColor(i)}"></div>
      <div class="wp-info">
        <div>${wp.lat.toFixed(5)}, ${wp.lon.toFixed(5)}</div>
        <div class="wp-prob" style="color:${wpColor(i)}">${wp.prob.toFixed(2)}%</div>
      </div>
    </div>`).join('') || '<div style="color:var(--text-dim);font-size:12px">계산 중...</div>');

      const oh = s.obs_history || [];
      syncMapPanel(s.map);

      // 이륙 지점을 입수 지점 기준 지도 cm 로 표시 (드론 좌표계의 0,0)
      if (s.map && s.map.takeoff_lon != null) {
        const m = s.map;
        const e = (m.takeoff_lon - m.origin_lon) * M_LON / m.scale * 100;
        const n = (m.takeoff_lat - m.origin_lat) * M_LAT / m.scale * 100;
        setText('d-takeoff', `동${e.toFixed(0)} 북${n.toFixed(0)} cm`);
      }

      setHTML('obs-list', oh.length
        ? oh.slice().reverse().slice(0, 5)
          .map(([lon, lat]) => `<div>📍 ${lat.toFixed(5)}, ${lon.toFixed(5)}</div>`).join('')
        : '없음');
    }

    function buildLegend() {
      const row = (c, t, shape) => {
        const sw = shape === 'line'
          ? `<span style="display:inline-block;width:16px;height:0;border-top:2px ${c.d || 'solid'} ${c.c};vertical-align:middle"></span>`
          : `<span style="display:inline-block;width:11px;height:11px;border-radius:${shape === 'sq' ? '2px' : '50%'};background:${c.c};vertical-align:middle"></span>`;
        return `<div>${sw} ${t}</div>`;
      };
      setHTML('legend', [
        row({ c: C.entry }, '입수 지점 / 드론 원점'),
        row({ c: C.particle }, '파티클'),
        row({ c: C.stranded }, '육지 도달'),
        row({ c: C.best }, '최고 확률 지점'),
        row({ c: C.obs }, '관측값 (클릭)'),
        row({ c: C.wp[0] }, '수색 우선순위'),
        row({ c: C.mapFrame, d: 'dashed' }, '실물 지도 경계', 'line'),
        ...(droneKind === 'auto'
          ? [row({ c: C.pathDone }, '완료한 비행 레그', 'line'),
          row({ c: C.pathTodo }, '예정 경로', 'line'),
          row({ c: C.pathSkip, d: 'dotted' }, '건너뛴 레그 (20cm 미만)', 'line')]
          : [row({ c: C.pathDone }, '드론이 지나간 경로', 'line'),
          row({ c: C.pathTodo }, '이동 중 (목표까지)', 'line')]),
        row({ c: C.takeoff }, '드론 이륙 지점 (0,0)'),
        row({ c: C.drone }, '드론 지령 위치'),
      ].join(''));
    }

    // ─────────────────────────────────────────────
    // 드론 제어
    // ─────────────────────────────────────────────
    let droneMode = 'dry';       // dry | real
    let droneKind = 'manual';    // manual(지점별 이동) | auto(자동 순회)
    let droneStatus = null, mission = null, missionErr = null;
    let armTimer = null, armLeft = 0;

    const clampInt = (v, lo, hi, dflt) => {
      const n = parseInt(v, 10);
      return isNaN(n) ? dflt : Math.max(lo, Math.min(hi, n));
    };
    const topN = () => clampInt(document.getElementById('p-top').value, 1, 10, 3);
    const speedVal = () => clampInt(document.getElementById('p-speed').value, 10, 100, 30);
    const hoverVal = () => {
      const n = parseFloat(document.getElementById('p-hover').value);
      return isNaN(n) ? 3 : Math.max(0, Math.min(30, n));
    };

    // FastAPI 의 {"detail": ...} 를 그대로 살려 올린다
    async function api(url, opts) {
      const r = await fetch(url, opts);
      let body = null;
      try { body = await r.json(); } catch (_) { /* 무시 */ }
      if (!r.ok) {
        const d = body && body.detail;
        throw new Error(typeof d === 'string' ? d : JSON.stringify(d || `HTTP ${r.status}`));
      }
      return body;
    }
    const postJSON = (url, obj) => api(url, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(obj || {}),
    });

    function setMode(mode) {
      if (droneStatus && droneStatus.running) return;
      if (mode === 'real' && droneMode !== 'real') {
        if (!confirm('실기체 모드로 전환합니다.\n브라우저에서 실제 드론이 이륙할 수 있습니다.\n계속할까요?')) return;
      }
      droneMode = mode;
      document.getElementById('m-dry').classList.toggle('on', mode === 'dry');
      document.getElementById('m-real').classList.toggle('on', mode === 'real');
      disarm();
      renderDrone();
    }

    async function droneConnect() {
      const btn = document.getElementById('btn-connect');
      btn.disabled = true; btn.textContent = '연결 중...';
      try {
        droneStatus = await postJSON('/drone/connect', { dry_run: droneMode === 'dry' });
        showError(null);
      } catch (e) {
        showError(e.message);
      } finally {
        btn.disabled = false; btn.textContent = '연결';
        renderDrone();
      }
    }

    async function droneLand() {
      disarm();
      try { droneStatus = await postJSON('/drone/land'); showError(null); }
      catch (e) { showError(e.message); }
      renderDrone();
    }

    // 이륙을 막는 첫 번째 사유. 무언의 비활성 버튼은 만들지 않는다.
    function startBlocker() {
      if (!droneStatus || !droneStatus.connected) return '연결 필요';
      if (droneStatus.running) return '명령 수행 중';
      if (droneStatus.battery != null && droneStatus.battery < 30)
        return `배터리 부족 (${droneStatus.battery}% / 최소 30%)`;

      // 수동 모드는 이륙만 하면 되므로 미션 유효성까지 볼 필요가 없다
      if (droneKind === 'manual') return null;

      if (missionErr) return missionErr;
      if (!mission || !mission.points || !mission.points.length) return '미션 없음 (waypoint 대기 중)';
      const oob = mission.points.filter(p => !p.in_bounds).map(p => 'WP' + p.rank);
      if (oob.length) return `${oob.join(', ')} 가 지도 밖입니다`;
      const long = mission.legs.find(l => !l.skip && Math.max(Math.abs(l.dx_cm), Math.abs(l.dy_cm)) > 500);
      if (long) return `leg${long.seq} 이동량이 500cm 를 초과합니다`;
      if (droneStatus.battery != null && droneStatus.battery < 30)
        return `배터리 부족 (${droneStatus.battery}% / 최소 30%)`;
      if (!mission.legs.some(l => !l.skip)) return '실행할 레그가 없습니다';
      return null;
    }

    function disarm() {
      if (armTimer) { clearInterval(armTimer); armTimer = null; }
      armLeft = 0;
    }

    function onStartClick() {
      if (startBlocker()) return;
      if (droneMode === 'dry') { doStart(); return; }
      if (armTimer) { disarm(); doStart(); return; }   // 2번째 클릭 → 발진
      armLeft = 3;
      // renderDrone() 이 armTimer 로 arm 상태를 판단하므로 반드시 먼저 설정한다.
      // 순서가 뒤집히면 첫 클릭에 버튼이 그대로라, 눌린 걸 알 수 없다.
      armTimer = setInterval(() => {
        armLeft--;
        if (armLeft <= 0) disarm();
        renderDrone();
      }, 1000);
      renderDrone();
    }

    function setKind(kind) {
      if (droneStatus && (droneStatus.running || droneStatus.airborne)) return;
      droneKind = kind;
      document.getElementById('k-manual').classList.toggle('on', kind === 'manual');
      document.getElementById('k-auto').classList.toggle('on', kind === 'auto');
      disarm();
      buildLegend();          // 모드마다 경로 심볼이 다르다
      renderDrone(); requestRender();
    }

    // ── 수동 이동 ──
    // 자동 순회와 달리 이동 후에도 착륙하지 않는다. 지점을 하나씩 보낸다.
    function onTakeoffClick() {
      if (droneStatus && droneStatus.airborne) return;
      if (droneMode === 'dry') { doTakeoff(); return; }
      if (armTimer) { disarm(); doTakeoff(); return; }   // 2번째 클릭 → 이륙
      armLeft = 3;
      armTimer = setInterval(() => {
        armLeft--;
        if (armLeft <= 0) disarm();
        renderDrone();
      }, 1000);
      renderDrone();
    }

    async function doTakeoff() {
      try { droneStatus = await postJSON('/drone/takeoff'); showError(null); }
      catch (e) { showError(e.message); }
      renderDrone(); requestRender();
    }

    async function droneGoto(p) {
      try {
        droneStatus = await postJSON('/drone/goto',
          { lon: p.lon, lat: p.lat, speed: speedVal(), label: `WP${p.rank}` });
        showError(null);
      } catch (e) { showError(e.message); }
      renderDrone(); requestRender();
    }

    async function clearDronePath() {
      try { droneStatus = await postJSON('/drone/path/reset'); showError(null); }
      catch (e) { showError(e.message); }
      renderDrone(); requestRender();
    }

    async function droneHome() {
      try { droneStatus = await postJSON(`/drone/home?speed=${speedVal()}`); showError(null); }
      catch (e) { showError(e.message); }
      renderDrone(); requestRender();
    }

    async function doStart() {
      try {
        const r = await postJSON('/drone/start',
          { top_n: topN(), speed: speedVal(), hover_sec: hoverVal() });
        droneStatus = r.status; mission = r.mission;
        showError(null);
      } catch (e) {
        showError(e.message);
      }
      renderDrone();
      requestRender();
    }

    function showError(msg) {
      const el = document.getElementById('d-error');
      el.style.display = msg ? '' : 'none';
      el.textContent = msg || '';
    }

    const PHASE_BADGE = {
      idle: 'b-grey', connecting: 'b-amber', ready: 'b-blue',
      takeoff: 'b-green', flying: 'b-green', landing: 'b-amber', error: 'b-red',
    };
    const RESULT_BADGE = {
      completed: 'b-green', aborted: 'b-amber', incomplete: 'b-amber', error: 'b-red',
    };
    const RESULT_TEXT = {
      completed: '정상 완료', aborted: '사용자 중단',
      incomplete: '미완', error: '실패',
    };

    function renderDrone() {
      const st = droneStatus;

      // 상태
      const phase = st ? st.phase : 'idle';
      const pe = document.getElementById('d-phase');
      pe.textContent = phase + (st && st.dry_run === false ? ' · 실기체' : '');
      pe.className = 'badge ' + (PHASE_BADGE[phase] || 'b-grey')
        + (phase === 'flying' || phase === 'takeoff' ? ' pulsing' : '');

      const batt = st && st.battery != null ? st.battery : null;
      setText('d-batt', batt != null ? batt + '%' : '-');
      const bb = document.getElementById('d-batt-bar');
      bb.style.width = (batt != null ? batt : 0) + '%';
      bb.style.background = batt != null && batt < 30 ? '#dc2626' : 'var(--accent)';

      const done = st ? st.leg_done : 0, total = st ? st.leg_total : 0;
      setText('d-leg', total ? `${done} / ${total}` : '-');
      document.getElementById('d-leg-bar').style.width = total ? (done / total * 100) + '%' : '0%';

      const rr = document.getElementById('d-result-row');
      if (st && st.result) {
        rr.style.display = '';
        const re = document.getElementById('d-result');
        re.textContent = RESULT_TEXT[st.result] || st.result;
        re.className = 'badge ' + (RESULT_BADGE[st.result] || 'b-grey');
      } else rr.style.display = 'none';

      // 미션 미리보기. 수동 모드에선 각 지점에 이동 버튼을 붙인다.
      if (mission && mission.points) {
        const canGo = droneKind === 'manual' && st && st.airborne && !st.running;
        setHTML('mission-list', mission.points.map((p, i) => `
      <div class="mrow">
        <div class="mchip" style="background:${wpColor(p.rank - 1)};color:${C.wpText}">${p.rank}</div>
        <div style="flex:1">${p.prob != null ? p.prob.toFixed(2) + '%' : '-'}
          <span style="color:var(--text-dim)">x${p.tello_x_cm.toFixed(0)} y${p.tello_y_cm.toFixed(0)}</span>
        </div>
        ${droneKind === 'manual'
            ? `<button class="btn" data-go="${i}" ${canGo && p.in_bounds ? '' : 'disabled'}
                     style="width:auto;padding:2px 9px;font-size:11px">이동</button>`
            : `<div class="${p.in_bounds ? 'ok' : 'bad'}">${p.in_bounds ? '✓' : '✗ 지도 밖'}</div>`}
      </div>`).join(''));

        // innerHTML 로 매번 새로 만들어지므로 핸들러도 다시 붙인다
        if (droneKind === 'manual') {
          document.querySelectorAll('#mission-list button[data-go]').forEach(b => {
            b.onclick = () => droneGoto(mission.points[+b.dataset.go]);
          });
        }

        const legs = mission.legs.filter(l => !l.skip);
        const dist = legs.reduce((a, l) => a + l.dist_cm, 0);
        const eta = dist / speedVal() + hoverVal() * legs.length + 8;
        setHTML('mission-meta',
          `<span>경로 ${(dist / 100).toFixed(2)} m · ${legs.length} 레그</span>
       <span class="val">약 ${Math.round(eta)}초</span>`);

        setHTML('mission-warn', (mission.warnings || []).map(w => {
          const blocking = w.includes('지도 밖');
          return `<div class="${blocking ? 'warn-blocking' : 'warn-info'}" style="font-size:10.5px;margin-top:3px">
                ${blocking ? '⛔' : '⚠'} ${w}</div>`;
        }).join(''));
      } else {
        setHTML('mission-list', `<div style="color:var(--text-dim)">${missionErr || '미션 대기 중...'}</div>`);
        setHTML('mission-meta', ''); setHTML('mission-warn', '');
      }

      // 모드별 컨트롤 전환
      const manual = droneKind === 'manual';
      document.getElementById('btn-start').style.display = manual ? 'none' : '';
      document.getElementById('manual-ctl').style.display = manual ? 'flex' : 'none';

      const why = startBlocker();
      const env = droneMode === 'real' ? '실기체' : 'DRY RUN';

      if (manual) {
        // btn-launch = 수동 이륙 버튼. 툴바의 btn-takeoff(이륙 지점 지정)와 다른 것이다.
        const tk = document.getElementById('btn-launch');
        const airborne = !!(st && st.airborne);
        tk.disabled = !!why || airborne;
        if (armTimer) { tk.textContent = `정말 이륙? (${armLeft})`; tk.className = 'btn arm'; }
        else if (airborne) { tk.textContent = '비행 중'; tk.className = 'btn'; }
        else { tk.textContent = `이륙 (${env})`; tk.className = 'btn go'; }
        document.getElementById('btn-home').disabled = !airborne || !!(st && st.running);
        // 자취 지우기는 표시만 바꾸므로 지울 게 있으면 언제든 가능
        document.getElementById('btn-clearpath').disabled = !(st && st.path && st.path.length > 1);
        // 유휴 자동착륙 카운트다운
        setText('start-why',
          airborne && st.idle_left != null ? `${st.idle_left}초 후 자동 착륙` : (why || ''));
      } else {
        const btn = document.getElementById('btn-start');
        btn.disabled = !!why;
        if (armTimer) { btn.textContent = `정말 이륙? (${armLeft})`; btn.className = 'btn arm'; }
        else { btn.textContent = `미션 시작 (${env})`; btn.className = 'btn go'; }
        setText('start-why', why || '');
      }

      // 이벤트 로그
      const ev = st && st.events && st.events.length ? st.events.join('\n') : '—';
      const box = document.getElementById('events');
      if (box.textContent !== ev) { box.textContent = ev; box.scrollTop = box.scrollHeight; }

      const busy = !!(st && st.running);
      ['m-dry', 'm-real'].forEach(i => {
        const el = document.getElementById(i);
        if (el) el.disabled = busy;
      });
    }

    // ── 폴링 ──
    async function pollStatus() {
      let wait = 2000;
      try {
        droneStatus = await api('/drone/status');
        wait = (droneStatus.connected || droneStatus.running) ? 500 : 2000;
        renderDrone();
        if (droneStatus.running) requestRender();
      } catch (e) {
        wait = 4000;
      }
      setTimeout(pollStatus, wait);
    }

    async function pollMission() {
      try {
        // 비행 중에는 미션이 스냅샷으로 고정돼 있으므로 덮어쓰지 않는다
        if (!(droneStatus && droneStatus.running)) {
          mission = await api(`/mission?top_n=${topN()}`);
          missionErr = null;
        }
      } catch (e) {
        mission = null; missionErr = e.message;
      }
      renderDrone();
      requestRender();
      setTimeout(pollMission, 1000);
    }

    ['p-top', 'p-speed', 'p-hover'].forEach(id =>
      document.getElementById(id).addEventListener('change', () => { renderDrone(); requestRender(); }));

    // ─────────────────────────────────────────────
    // 부트스트랩
    // ─────────────────────────────────────────────
    function resize() {
      const wrap = document.getElementById('canvas-wrap');
      const dpr = window.devicePixelRatio || 1;
      W = wrap.clientWidth; H = wrap.clientHeight;      // W/H 는 CSS 픽셀로 유지
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      updateProjection();
      requestRender();
    }
    window.addEventListener('resize', resize);

    function updateSimCard(d) {
      const status = document.getElementById('sim-status');
      status.textContent = d.sim_started
        ? `진행 중 — 경과 ${Math.floor(d.elapsed_sec / 60)}분 ${Math.floor(d.elapsed_sec % 60)}초`
        : '대기 중 — 낙하 판정을 기다립니다';
    }

    async function resetSimulation() {
      if (!confirm('시뮬레이션을 대기 상태로 되돌릴까요? 현재 파티클/히트맵/궤적이 모두 초기화됩니다.')) return;
      const errEl = document.getElementById('sim-error');
      try {
        await postJSON('/reset');
        errEl.style.display = 'none';
      } catch (e) {
        errEl.textContent = e.message;
        errEl.style.display = '';
      }
    }

    // thermalView: 'absolute'(실제 온도, 기본) | 'yolo'(YOLO가 보는 배경-상대
    // 보정 이미지) — 젯슨은 매 프레임 둘 다 같이 보내므로(POST /report의
    // thermal_image_base64/thermal_image_yolo_base64), 서버에 다시 요청할
    // 필요 없이 여기서 캐시해둔 둘 중 하나를 바로 바꿔 보여주기만 한다.
    let thermalView = 'absolute';
    let _lastThermalAbs = null;
    let _lastThermalYolo = null;
    let _lastThermalRenderKey = null;

    function setThermalView(view) {
      thermalView = view;
      document.getElementById('t-abs').classList.toggle('on', view === 'absolute');
      document.getElementById('t-yolo').classList.toggle('on', view === 'yolo');
      _lastThermalRenderKey = null;  // 캐시된 이미지로 바로 다시 그리게 강제
      renderThermalImg();
    }

    function renderThermalImg() {
      const img = document.getElementById('thermal-img');
      const b64 = thermalView === 'yolo' ? _lastThermalYolo : _lastThermalAbs;
      if (!b64) return;
      const key = thermalView + '|' + _lastThermalTs;
      if (key === _lastThermalRenderKey) return;
      _lastThermalRenderKey = key;
      img.src = 'data:image/jpeg;base64,' + b64;
      // 확대해서 보는 중이면 큰 쪽도 같이 갱신한다
      const modal = document.getElementById('thermal-modal');
      if (modal.classList.contains('on')) {
        document.getElementById('thermal-big').src = img.src;
      }
    }

    let _lastThermalTs = null;
    function updateThermalCard(d) {
      // POST /report로 온 열화상 이미지(sim_started/파티클과 무관하게 항상
      // 최신값) — 실제 온도(thermal_image_base64)/YOLO 시야
      // (thermal_image_yolo_base64) 둘 다 캐시해두고, 현재 선택된
      // thermalView에 맞는 쪽만 그린다(renderThermalImg 참고, 확대 모달
      // 갱신도 거기서 같이 처리).
      const img = document.getElementById('thermal-img');
      const empty = document.getElementById('thermal-empty');
      const meta = document.getElementById('thermal-meta');
      const zoom = document.getElementById('thermal-zoom');
      if (!d.thermal_image_base64) {
        img.style.display = 'none';
        empty.style.display = 'block';
        zoom.style.display = 'none';
        meta.textContent = '';
        return;
      }
      _lastThermalTs = d.thermal_image_ts;
      _lastThermalAbs = d.thermal_image_base64;
      _lastThermalYolo = d.thermal_image_yolo_base64;
      renderThermalImg();
      img.style.display = 'block';
      empty.style.display = 'none';
      zoom.style.display = 'block';
      meta.textContent = d.thermal_image_confirmed
        ? `✅ 확정됨${d.thermal_image_ts ? ' — ' + d.thermal_image_ts : ''}`
        : (d.thermal_image_ts || '');
      if (document.getElementById('thermal-modal').classList.contains('on')) {
        document.getElementById('thermal-big-meta').textContent = meta.textContent;
      }
    }

    function connect() {
      const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
      const el = document.getElementById('conn');
      ws.onopen = () => { el.textContent = '● 연결됨'; el.className = 'connected'; };
      ws.onclose = () => {
        el.textContent = '● 연결 끊김 — 재연결 중...'; el.className = 'disconnected';
        setTimeout(connect, 2000);
      };
      ws.onerror = () => ws.close();
      ws.onmessage = e => {
        let d;
        try { d = JSON.parse(e.data); } catch (_) { return; }
        if (!d || d.elapsed_sec === undefined) return;   // 첫 프레임은 {} 일 수 있다
        state = d;
        updateSimCard(d);
        updateThermalCard(d);
        updateScale(d);                                  // 스케일은 수신 시에만 갱신
        if (!boundsAdopted && d.bounds) {
          // 서버는 lon_min 형식, 뷰는 lonMin 형식 — 키를 옮겨 담아야 한다
          INIT = {
            lonMin: d.bounds.lon_min, lonMax: d.bounds.lon_max,
            latMin: d.bounds.lat_min, latMax: d.bounds.lat_max
          };
          boundsAdopted = true;
        }
        if (!mapFitted && d.map) { mapFitted = true; fitToMap(); }
        requestRender();
      };
    }

    applyTheme();
    resize();
    connect();
    pollStatus();
    pollMission();
  </script>

  <!-- 열화상 확대 보기 -->
  <div id="thermal-modal" onclick="closeThermal(event)">
    <img id="thermal-big" alt="열화상 확대">
    <div class="bar">
      <span id="thermal-big-meta"></span>
      <button id="thermal-close" onclick="closeThermal()">닫기 (Esc)</button>
    </div>
  </div>

  <script>
    // 열화상 확대. 원본 img 의 src 를 그대로 재사용하므로 추가 수신이 없다.
    function openThermal() {
      const img = document.getElementById('thermal-img');
      if (!img.src || img.style.display === 'none') return;   // 아직 수신 전
      document.getElementById('thermal-big').src = img.src;
      document.getElementById('thermal-big-meta').textContent =
        document.getElementById('thermal-meta').textContent;
      document.getElementById('thermal-modal').classList.add('on');
    }

    function closeThermal(e) {
      // 이미지 자체를 클릭한 경우는 닫지 않는다 (확대 상태 유지)
      if (e && e.target && e.target.id === 'thermal-big') return;
      document.getElementById('thermal-modal').classList.remove('on');
    }

    // Esc 로 닫기. 캔버스 단축키보다 먼저 잡아야 비상착륙이 잘못 호출되지 않는다.
    window.addEventListener('keydown', e => {
      if (e.key === 'Escape' &&
          document.getElementById('thermal-modal').classList.contains('on')) {
        e.stopImmediatePropagation();
        closeThermal();
      }
    }, true);
  </script>
</body>
